---
name: Windows Troubleshooting

on:
  workflow_dispatch:

jobs:
  windows_troubleshooting:
    runs-on: windows-latest
    steps:
      - name: Cleanup working directory
        working-directory: ${{ github.workspace }}
        run: del *.* /Q /S
        shell: cmd
      
      - name: Setup MSBuild and VS Dev environment
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Install Intel IPP
        shell: cmd
        run: |
          nuget install intelipp.static.win-x64 -Version 2026.0.0.712
          echo Intel IPP installed

      - name: Cache HISE build
        id: cache-hise
        uses: actions/cache@v4
        with:
          path: HISE
          key: ${{ runner.os }}-hise-RELEASE-juce6-${{ hashFiles('HISE/tools/auto_build/build_ci.bat') }}
          restore-keys: |
            ${{ runner.os }}-hise-RELEASE-juce6-
            ${{ runner.os }}-hise-

      - name: Checkout HISE repo
        uses: actions/checkout@v6
        with:
          repository: christophhart/HISE
          ref: develop
          clean: true
          submodules: false
          path: HISE

      - name: Checkout JUCE submodules
        shell: cmd
        run: |
          cd HISE
          git submodule update --init --recursive
          cd JUCE
          git checkout juce6

      - name: Checkout eshurl HISE
        uses: actions/checkout@v6
        with:
          ref: develop
          path: eschirle/HISE

      - name: Copy HISE build script and overwrite
        working-directory: ${{ github.workspace }}/HISE/tools/auto_build/
        shell: cmd
        # Copies the build_ci.bat script from the eschirle/HISE/tools/auto_build to HISE/tools/auto_build directory, overwriting the existing file.
        run: |
          copy /Y "${{ github.workspace }}\eschirle\HISE\tools\auto_build\build_ci.bat" "${{ github.workspace }}\HISE\tools\auto_build\build_ci.bat"

      - name: Build HISE
        working-directory: ${{ github.workspace }}/HISE/tools/auto_build/
        shell: cmd
        run: |
          chdir
          build_ci.bat "RELEASE" --use-ipp

      - name: Print HISE CompilerSettings and disable IPP
        shell: pwsh
        run: |
          $settingsPath = Join-Path -Path $env:APPDATA -ChildPath "HISE\compilerSettings.xml"
          
          if (Test-Path $settingsPath) {
              Write-Host "Found compilerSettings.xml at: $settingsPath"
              
              # Print the current contents to the GitHub Actions log
              Write-Host "--- Current File Contents ---"
              Get-Content $settingsPath | Write-Host
              Write-Host "-----------------------------"
              
              # Read the file, replace the string, and write it back
              # The parentheses around (Get-Content) are important so the file is closed before writing back
              (Get-Content $settingsPath) -replace '<UseIPP value="1"/>', '<UseIPP value="0"/>' | Set-Content $settingsPath
              
              Write-Host "Successfully updated UseIPP to 0."
          } else {
              Write-Host "File not found at: $settingsPath"
          }
      
      - name: Update compiler settings with Hise Cli
        shell: cmd
        run: |
          set hise_path=${{ github.workspace }}\HISE\projects\standalone\Builds\VisualStudio2026\x64\Release\App\HISE.exe
          if exist "!hise_path!" (
              echo Found HISE binary at: !hise_path!
              "!hise_path!" set_hise_settings -vs:2026 -ipp:0
          ) else (
              echo HISE binary not found at: !hise_path!
              exit /b 1
          )